cameras:
- id: CAM_127_0_0_1
  name: Cámara cam_1
  type: rtsp
  camera_ip: 127.0.0.1
  rtsp_port: 57807
  username: admin
  password: password
  channel: 1
  subtype: 1
  frame_skip: 1
  reconnect_interval_sec: 5
  tracking_priority:
  - person
  spotlight:
    enabled: true
    night_only: true
    trigger_classes:
    - person
    trigger_delay_sec: 3
    flash_duration_sec: 5
    one_shot_per_target: true
    cooldown_sec: 8
  ptz:
    enabled: auto
    driver: onvif
    onvif_port: 57807
    patrol_interval_sec: 12
    patrol_type: preset_tour
    preset_tour:
    - preset: '1'
      dwell_time_sec: 20
    - preset: '4'
      dwell_time_sec: 20
    - preset: '2'
      dwell_time_sec: 20
    patrol_speed: 0.35
    panoramic_patrol: true
    sweep_pan_time_sec: 14
    tilt_transition_time_sec: 3
    patrol_tilt_speed: 0.35
    tracking_speed: 0.65
    deadzone_x: 0.08
    deadzone_y: 0.08
    static_target_timeout_sec: 3
    manual_override_pause_sec: 180
    tracking_enabled: true
    patrol_enabled: true
    positioning_mode: native_preset
    home_preset: '1'
    initial_homing: true
    tracking_priority:
    - person
    auto_zoom:
      enabled: true
      target_height_ratio_min: 0.18
      target_height_ratio_max: 0.5
      zoom_speed: 0.35
    smoothing:
      enabled: false
      alpha: 0.35
  geofence:
    enabled: false
    mode: inclusion
    points: []
  event_recording:
    enabled: false
    pre_alarm_sec: 3
    post_alarm_sec: 5
storage:
  save_video: false
  save_snapshots: false
security:
  auth_enabled: false
  admin_username: admin
  admin_password: admin123
detection:
  model_name: yolov8n.pt
  target_classes:
  - truck
  - motorcycle
  - cat
  - dog
  - bus
  - car
  - person
  confidence: 0.3
  device: auto
display:
  show_window: true
  window_title: AI Multi-Camera Vision & PTZ Tracker
  cell_width: 640
  cell_height: 360
  draw_hud: true
logging:
  quiet: true
  level: ERROR
