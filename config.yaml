cameras: []

storage:
  save_video: false
  save_snapshots: false
detection:
  model_name: yolov8n.pt
  target_classes:
  - person
  - car
  - truck
  - bus
  - motorcycle
  - dog
  confidence: 0.3
  device: auto
display:
  show_window: true
  window_title: AI Multi-Camera Vision & PTZ Tracker
  cell_width: 640
  cell_height: 360
  draw_hud: true
logging:
  quiet: true
  level: ERROR
